<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightAudit</title>
<meta name="description" content="LightAudit checks whether one light explains every part of a photo. A flag means send for human review, never fraud.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2386868b' stroke-width='2.5'/%3E%3Ccircle cx='22' cy='10' r='5' fill='%23f5b23d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  // Cross-page view transitions: a transition skipped because the page was already shown is not an error.
  ['pagereveal', 'pageswap'].forEach(function (n) { window.addEventListener(n, function (e) {
    if (e.viewTransition) { e.viewTransition.ready.catch(function () {}); e.viewTransition.finished.catch(function () {}); } }); });
</script>
<script>
  // Theme before first paint (localStorage may be unavailable: private mode, file://).
  try { var t = JSON.parse(localStorage.getItem('lightaudit.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}  // prefs stores JSON
</script>
<script>
  // Import map: vendored Three.js (offline) with the jsDelivr CDN as a fallback when viewer/vendor/ is absent.
  (function () {
    var CDN = 'https://cdn.jsdelivr.net/npm/three@0.160.0/';
    function boot(local) {
      var map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: local
        ? { 'three': './vendor/three.module.js', 'three/addons/': './vendor/addons/' }
        : { 'three': CDN + 'build/three.module.js', 'three/addons/': CDN + 'examples/jsm/' } });
      document.head.appendChild(map);
      var app = document.createElement('script');
      app.type = 'module';
      app.src = 'app.js';
      document.head.appendChild(app);
    }
    fetch('vendor/three.module.js', { method: 'HEAD' })
      .then(function (r) { boot(r.ok); }, function () { boot(false); });
  })();
</script>
</head>
<body>
<div id="root"><div class="load-screen"><p>LightAudit</p></div></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">The LightAudit viewer needs JavaScript and WebGL2.</p></noscript>
</body>
</html>
